[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[project]
name = "profile-match"
dynamic = ["version"]
description = "Explainable resume-screening assistant: ranks resumes against a job description, shows the evidence, and leaves the decision to the recruiter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akshay Jhijhautia" }]
keywords = ["resume-screening", "recruitment", "llm-agent", "langgraph", "rag", "explainable-ai", "local-first", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Retrieval engine: file reading, local embeddings, vector index (SQLite + NumPy), hybrid search
    "openai>=1.40",
    "numpy>=1.26",
    "fastembed>=0.9,<1",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # Agent: LangGraph graph, saved sessions, LLM access, terminal chat
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "rich>=13.0",
    # Web app: local API server
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Chat model providers besides OpenAI (LLM_PROVIDER=anthropic|google|ollama)
anthropic = ["langchain-anthropic>=1.7,<2"]
google = ["langchain-google-genai>=4.4,<5"]
ollama = ["langchain-ollama>=1.1,<2"]
# Tests and development tools (sample resume generator)
dev = ["pytest>=8.0", "pyflakes>=3.2", "fpdf2>=2.7"]

[project.scripts]
profile-match = "profile_matching.app:main"

[project.urls]
Repository = "https://github.com/Akshay-Jhijhautia/Agentic-Profile-Matching"
Changelog = "https://github.com/Akshay-Jhijhautia/Agentic-Profile-Matching/blob/main/CHANGELOG.md"
Issues = "https://github.com/Akshay-Jhijhautia/Agentic-Profile-Matching/issues"

[tool.setuptools.dynamic]
version = { attr = "profile_matching.__version__" }

[tool.setuptools.packages.find]
include = ["profile_matching*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
