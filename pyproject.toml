[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-match"
dynamic = ["version"]
description = "AI recruiting agent for the terminal: screens resumes against a job description in three rounds and explains every score."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akshay Jhijhautia" }]
keywords = ["resume-screening", "recruitment", "llm-agent", "langgraph", "rag", "explainable-ai", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Retrieval engine: file reading, ChromaDB index, hybrid search
    "openai>=1.40",
    "chromadb>=1.5",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # Agent: LangGraph graph, saved sessions, LLM access, terminal chat
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "rich>=13.0",
]

[project.optional-dependencies]
# Chat model providers besides OpenAI (LLM_PROVIDER=anthropic|google|ollama)
anthropic = ["langchain-anthropic>=1.7,<2"]
google = ["langchain-google-genai>=4.4,<5"]
ollama = ["langchain-ollama>=1.1,<2"]
# Tests and development tools (sample resume generator)
dev = ["pytest>=8.0", "pyflakes>=3.2", "fpdf2>=2.7"]

[project.scripts]
profile-match = "profile_matching.app:main"

[project.urls]
Repository = "https://github.com/Akshay-Jhijhautia/Agentic-Profile-Matching"

[tool.setuptools.dynamic]
version = { attr = "profile_matching.__version__" }

[tool.setuptools.packages.find]
include = ["profile_matching*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
